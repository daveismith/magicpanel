name: cmd_01_allontimed_0
description: "I2C command 1: allONTimed(0) panel on indefinitely (observe ON state only; the handler blocks for 1000 s)"
firmware_reset: true
eeprom: default
run_ms: 1500
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [1] }
