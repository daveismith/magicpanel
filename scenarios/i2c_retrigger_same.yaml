name: i2c_retrigger_same
description: "TwoLoop (cmd 29) sent at 100 ms and again at 1100 ms: the second send restarts TwoLoop from its first frame"
firmware_reset: true
eeprom: default
run_ms: 7200
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [29] }
  - at_ms: 1100
    i2c_write: { addr: 0x14, bytes: [29] }
