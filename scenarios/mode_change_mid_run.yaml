name: mode_change_mid_run
description: "Rotary changes at runtime: mode 0 -> mode 2 (FlashAll repeating) at 1 s -> mode 0 at 5 s; each change must blank the panel (blankPANEL)"
firmware_reset: true
eeprom: default
run_ms: 7000
steps:
  - at_ms: 1000
    gpio_set: { pin: C1, value: 0 }
  - at_ms: 5000
    gpio_set: { pin: C1, value: 1 }
