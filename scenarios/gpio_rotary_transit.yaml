name: gpio_rotary_transit
description: "Rotary moves from code 3 to code 4 through code 2 and code 0 (5 ms each): only code 4 is stable long enough, so TwoLoop is replaced by TraceDown once, with no idle in between"
firmware_reset: true
eeprom: default
run_ms: 5000
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 0
    gpio_set: { pin: C1, value: 0 }
  - at_ms: 0
    gpio_set: { pin: C2, value: 0 }
  - at_ms: 2000
    gpio_set: { pin: C2, value: 1 }
  - at_ms: 2005
    gpio_set: { pin: C1, value: 1 }
  - at_ms: 2010
    gpio_set: { pin: C0, value: 0 }
