name: i2c_read_probe
description: "Master read from the slave (protocol v1: the identity registers; the specimen answered 0x00), no display change, then allOFF"
firmware_reset: true
eeprom: default
run_ms: 1500
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_read: { addr: 0x14, n: 2 }
  - at_ms: 400
    i2c_write: { addr: 0x14, bytes: [0] }
