name: gpio_jumper_override_no_retrigger
description: "Jumper 1 (B3) from power-on gives mode 8 (panel on); C0 goes low at 500 ms but the jumper overrides the rotary, the code stays 8, so nothing blanks or restarts"
firmware_reset: true
eeprom: default
run_ms: 1500
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 0
    gpio_set: { pin: B3, value: 0 }
  - at_ms: 500
    gpio_set: { pin: C0, value: 0 }
