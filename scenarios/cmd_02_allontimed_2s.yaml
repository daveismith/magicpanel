name: cmd_02_allontimed_2s
description: "I2C command 2: allONTimed(2000) falls through to allONTimed(5000)"
firmware_reset: true
eeprom: default
run_ms: 8700
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [2] }
