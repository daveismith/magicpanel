name: cmd_09_traceup_type2
description: "I2C command 9: TraceUp(5,2) single row"
firmware_reset: true
eeprom: default
run_ms: 9800
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [9] }
