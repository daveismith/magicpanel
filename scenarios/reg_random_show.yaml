name: reg_random_show
description: "Register START of the random show (catalogue 56, rotary modes 6/9 over I2C): one pattern and the start of the off interval"
firmware_reset: true
eeprom: default
run_ms: 26000
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [160, 56] }
