name: i2c_garbage
description: "Invalid and malformed I2C traffic: byte 200 (register pointer 0x48 under protocol v1), empty write, foreign address, then a 2-byte legacy write, which is rejected (BAD_LENGTH) and no longer deafens the receiver (the specimen ran Cross and then ignored everything, firmware-map 3.3), so the following FlashAll runs; ends with a master read"
firmware_reset: true
eeprom: default
run_ms: 9000
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [200] }
    label: "byte 200: sets the register pointer"
  - at_ms: 300
    i2c_write: { addr: 0x14, bytes: [] }
    label: "empty write (address only)"
  - at_ms: 500
    i2c_write: { addr: 0x15, bytes: [20] }
    label: "Cross to foreign address 0x15"
  - at_ms: 700
    i2c_write: { addr: 0x14, bytes: [20, 5] }
    label: "2-byte legacy write [20, 5]: rejected, receiver stays responsive"
  - at_ms: 4500
    i2c_write: { addr: 0x14, bytes: [26] }
    label: "cmd 26 FlashAll (runs)"
  - at_ms: 8500
    i2c_read: { addr: 0x14, n: 2 }
