name: i2c_mid_animation
description: "Cross (3 s) sent while Toggle (10 s) is running: Cross replaces Toggle at the next frame boundary and Toggle does not resume (the specimen nested Cross inside the TWI ISR and resumed Toggle afterwards)"
firmware_reset: true
eeprom: default
run_ms: 15000
timing_tolerance_cycles: 8000
timing_tolerance_reason: "D-20: frames are scheduled from loop() (main-loop sequence engine), not delay(); settled frames land within ~0.2 ms of the specimen's"
steps:
  - at_ms: 100
    i2c_write: { addr: 0x14, bytes: [5] }
  - at_ms: 2100
    i2c_write: { addr: 0x14, bytes: [20] }
