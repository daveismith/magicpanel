name: firmware-regression

on:
  push:
    paths:
      - "MagicPanel.ino"
      - "MagicPanel_v010_5.ino"
      - "harness/**"
      - "scenarios/**"
      - "tests/**"
      - "tools/**"
      - "mcp/**"
      - "third_party/**"
      - ".gitmodules"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/firmware-regression.yml"
      - ".github/actions/toolchain/**"
  pull_request:
    paths:
      - "MagicPanel.ino"
      - "MagicPanel_v010_5.ino"
      - "harness/**"
      - "scenarios/**"
      - "tests/**"
      - "tools/**"
      - "mcp/**"
      - "third_party/**"
      - ".gitmodules"
      - "requirements.txt"
      - "Makefile"
      - ".github/workflows/firmware-regression.yml"
      - ".github/actions/toolchain/**"
  workflow_dispatch:

# Actions are pinned to full commit SHAs (immutable); the trailing comment records the release
# tag each SHA was resolved from. Bump deliberately, updating both together.
permissions:
  contents: read
  pull-requests: write

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # pinned toolchain, caches, make setup + make harness (network only here)
      - uses: ./.github/actions/toolchain

      # --- everything below runs without network ----------------------------------------------
      - name: Specimen guard + reference build (must reproduce the shipped ELF's flash image)
        run: make reference

      - name: Build dev firmware MagicPanel.ino (twice; must be deterministic)
        run: make firmware

      - name: Run all scenarios and compare to baselines
        run: .venv/bin/python -m pytest tests/test_regression.py -v

      - name: Determinism check (full suite twice, byte-identical)
        run: .venv/bin/python -m pytest tests/test_determinism.py -v

      - name: Mutation self-test (every mutant must be detected)
        run: .venv/bin/python -m pytest tests/test_mutants.py -v

      - name: I2C register interface (protocol v1 against the spec and header)
        run: .venv/bin/python -m pytest tests/test_i2c_protocol.py -v

      - name: MCP server, specimen and release tooling tests
        run: .venv/bin/python -m pytest tests/test_mcp.py tests/test_specimen.py tests/test_check_version.py -v

      # --- failure diagnostics -----------------------------------------------------------------
      - name: Collect diff reports
        if: failure()
        run: |
          {
            echo "## Firmware regression: FAILED"
            echo
            for f in $(find runs -name diff_report.md | sort); do
              if grep -q '^\*\*FAIL\*\*' "$f"; then
                echo "<details><summary>$f</summary>"; echo; echo '```'; head -c 6000 "$f"; echo '```'; echo "</details>"; echo
              fi
            done
          } > pr-comment.md
          head -c 200 pr-comment.md

      - name: Upload run artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runs-${{ github.run_id }}
          path: |
            runs/**/diff_report.md
            runs/**/filmstrip.txt
            runs/**/display.jsonl
            runs/**/frames.jsonl
            runs/**/i2c.jsonl
            runs/**/events.jsonl
            runs/**/trace.vcd
            build/metadata.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Post diff report as PR comment
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('pr-comment.md') ? fs.readFileSync('pr-comment.md', 'utf8') : 'Regression failed; see workflow artefacts.';
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: body.slice(0, 60000) });
