name: Magic Panel toolchain
description: >
  Pinned arduino-cli + AVR core, libsimavr, Python venv and harness/mpsim (make setup + make
  harness), with caches. Run actions/checkout (with submodules) first. docs=true also installs
  the documentation toolchain (requirements-docs.txt).

inputs:
  docs:
    description: also install requirements-docs.txt (Zensical, mike)
    default: "false"

runs:
  using: composite
  steps:
    - name: Host packages (libelf for simavr)
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libelf-dev pkg-config build-essential

    # Actions are pinned to full commit SHAs; the trailing comment is the release tag.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Read pinned versions
      id: pins
      shell: bash
      run: |
        set -a; source tools/versions.env; set +a
        echo "cli=$ARDUINO_CLI_VERSION" >> "$GITHUB_OUTPUT"
        echo "core=$AVR_CORE_VERSION" >> "$GITHUB_OUTPUT"
        echo "simavr=$SIMAVR_SHA" >> "$GITHUB_OUTPUT"

    - name: Cache arduino toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          tools/bin
          tools/arduino-data
        key: arduino-${{ runner.os }}-cli${{ steps.pins.outputs.cli }}-core${{ steps.pins.outputs.core }}-v1

    - name: Cache libsimavr
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: third_party/simavr/simavr/obj-*
        key: simavr-${{ runner.os }}-${{ steps.pins.outputs.simavr }}-v1

    - name: Cache python venv
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv
        key: venv-${{ runner.os }}-py3.12-docs${{ inputs.docs }}-${{ hashFiles('requirements.txt', 'requirements-docs.txt') }}

    - name: Setup (pinned arduino-cli, AVR core, libsimavr, venv)
      shell: bash
      run: make setup

    - name: Documentation toolchain
      if: inputs.docs == 'true'
      shell: bash
      run: make docs-setup

    - name: Build harness
      shell: bash
      run: make harness
